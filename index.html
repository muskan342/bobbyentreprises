        // ============================================================================
        // SYSTEM UTILITIES & CALCULATORS
        // ============================================================================
        const formatCurrency = (amount, lang = 'en') => {
            const sym = DICTIONARY[lang].currencySymbol;
            const val = Number(amount || 0).toLocaleString('en-IN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            return `${sym} ${val}`;
        };

        const calculateGstExtraction = (totalAmount, gstPercent, isInclusive) => {
            const amt = Number(totalAmount || 0);
            const rate = Number(gstPercent || 0);
            if (isInclusive) {
                const taxAmount = amt - (amt / (1 + (rate / 100)));
                const taxableAmount = amt - taxAmount;
                return { taxableAmount, taxAmount };
            } else {
                const taxAmount = amt * (rate / 100);
                const taxableAmount = amt;
                return { taxableAmount, taxAmount };
            }
        };

        // ============================================================================
        // REACT MAIN ENTERPRISE APPLICATION RUNTIME
        // ============================================================================
        function App() {
            // Destructure Lucide Icons dynamically for easy usage within script context
            const { 
                Briefcase, Users, Package, FileText, Settings, Sparkles, TrendingUp, AlertCircle, 
                Plus, Search, ArrowUpRight, ArrowDownLeft, Download, RefreshCw, CheckCircle, 
                X, UserPlus, Trash2, Globe, FileCheck, Send, ChevronDown, Printer
            } = Lucide;

            // 1. Core State & App Navigation
            const [lang, setLang] = React.useState('en');
            const [currentTab, setCurrentTab] = React.useState('dashboard');
            const [activeBusinessId, setActiveBusinessId] = React.useState('biz-101');
            const [alertBanner, setAlertBanner] = React.useState(null);
            
            // Interactive modal state flags
            const [showBusinessWizard, setShowBusinessWizard] = React.useState(false);
            const [showTransactionModal, setShowTransactionModal] = React.useState(null); 
            const [showPartyModal, setShowPartyModal] = React.useState(false);
            const [showItemModal, setShowItemModal] = React.useState(false);
            const [previewInvoice, setPreviewInvoice] = React.useState(null); 
            const [previewTemplate, setPreviewTemplate] = React.useState('a4'); 

            // Search query state
            const [globalSearchTerm, setGlobalSearchTerm] = React.useState('');

            // Multi-business list initialization
            const [businesses, setBusinesses] = React.useState([
                {
                    id: 'biz-101',
                    name: 'Bobby Enterprises Head Office',
                    gstin: '07AAAAA1111A1Z1',
                    taxScheme: 'regular',
                    address: 'Plot No 42, Sector 18, Industrial Area',
                    pincode: '110015',
                    state: 'Delhi',
                    phoneNumber: '+91 9999988888',
                    email: 'corp@bobbyenterprises.com',
                    watermark: true,
                    signature: 'B. Enterprises Auth Sign',
                    customFields: []
                }
            ]);

            // Production Ready Principle: Clean empty state array arrays (Zero Sample Data Seeded)
            const [parties, setParties] = React.useState([]); 
            const [inventory, setInventory] = React.useState([]); 
            const [transactions, setTransactions] = React.useState([]); 

            // Form bindings templates
            const [newBusinessForm, setNewBusinessForm] = React.useState({
                name: '', gstin: '', taxScheme: 'regular', address: '', pincode: '', state: 'Delhi', phoneNumber: '', email: '', watermark: true, signature: '', customFields: []
            });

            const [newPartyForm, setNewPartyForm] = React.useState({
                name: '', type: 'customer', mobile: '', address: '', state: 'Delhi', creditLimit: '50000', openingBalance: '0', customFields: []
            });

            const [newItemForm, setNewItemForm] = React.useState({
                name: '', sku: '', hsn: '', salePrice: '', purchasePrice: '', taxRate: '18', stockQty: '', lowStockAlert: '5', inclusive: true, customFields: []
            });

            const [txForm, setTxForm] = React.useState({
                partyId: '', date: new Date().toISOString().split('T')[0], invoiceNo: '', items: [], paymentMode: 'cash', receivedAmount: '', terms: 'Goods once sold will not be taken back.', customFields: []
            });

            const [tempCustomField, setTempCustomField] = React.useState({ label: '', value: '' });

            // AI Contextual interaction state
            const [aiInput, setAiInput] = React.useState('');
            const [aiHistory, setAiHistory] = React.useState([
                { role: 'assistant', text: 'Greetings from Bobby Enterprises AI Suite. Ask me to construct sales analysis, evaluate low stocks, summarize tax tiers, or locate aging customer balances.' }
            ]);
            const [aiLoading, setAiLoading] = React.useState(false);

            const triggerAlert = (type, text) => {
                setAlertBanner({ type, text });
                setTimeout(() => setAlertBanner(null), 4000);
            };

            React.useEffect(() => {
                if (showTransactionModal) {
                    const count = transactions.filter(t => t.businessId === activeBusinessId && t.type === showTransactionModal).length;
                    const prefix = showTransactionModal === 'sale' ? 'SAL-2026-' : 'PUR-2026-';
                    setTxForm(prev => ({
                        ...prev,
                        invoiceNo: `${prefix}${String(count + 1).padStart(4, '0')}`,
                        items: [{ itemId: '', qty: 1, rate: 0, taxRate: 18, inclusive: true, discount: 0 }],
                        receivedAmount: '',
                        partyId: '',
                        customFields: []
                    }));
                }
            }, [showTransactionModal, transactions, activeBusinessId]);

            const activeBusiness = React.useMemo(() => {
                return businesses.find(b => b.id === activeBusinessId) || businesses[0];
            }, [businesses, activeBusinessId]);

            const t = (key) => DICTIONARY[lang][key] || key;

            // Filtering datasets
            const filteredParties = React.useMemo(() => {
                return parties.filter(p => p.name.toLowerCase().includes(globalSearchTerm.toLowerCase()) || p.mobile.includes(globalSearchTerm));
            }, [parties, globalSearchTerm]);

            const filteredInventory = React.useMemo(() => {
                return inventory.filter(item => item.name.toLowerCase().includes(globalSearchTerm.toLowerCase()) || item.sku.toLowerCase().includes(globalSearchTerm.toLowerCase()));
            }, [inventory, globalSearchTerm]);

            // Real-time calculation computation matrices
            const calculatedTransactions = React.useMemo(() => {
                return transactions.map(tx => {
                    let subtotalSum = 0;
                    let totalTaxSum = 0;
                    let totalDiscountSum = 0;

                    tx.items.forEach(it => {
                        const itemQty = Number(it.qty || 0);
                        const itemRate = Number(it.rate || 0);
                        const discountAmt = Number(it.discount || 0);
                        const lineTotalRaw = (itemQty * itemRate) - discountAmt;

                        const { taxableAmount, taxAmount } = calculateGstExtraction(lineTotalRaw, it.taxRate, it.inclusive);
                        subtotalSum += taxableAmount;
                        totalTaxSum += taxAmount;
                        totalDiscountSum += discountAmt;
                    });

                    const grandTotalRaw = subtotalSum + totalTaxSum;
                    const roundedTotal = Math.round(grandTotalRaw);
                    const roundOffDifference = roundedTotal - grandTotalRaw;
                    const remainingBalance = roundedTotal - Number(tx.receivedAmount || 0);

                    const partyObj = parties.find(p => p.id === tx.partyId);

                    return {
                        ...tx,
                        partyName: partyObj ? partyObj.name : 'Walk-in Cash Sale',
                        subtotal: subtotalSum,
                        taxAmount: totalTaxSum,
                        discount: totalDiscountSum,
                        total: roundedTotal,
                        roundOff: roundOffDifference,
                        balanceDue: remainingBalance >= 0 ? remainingBalance : 0
                    };
                });
            }, [transactions, parties]);

            const activeTransactionsFiltered = React.useMemo(() => {
                return calculatedTransactions.filter(tx => {
                    if (tx.businessId !== activeBusinessId) return false;
                    if (globalSearchTerm) {
                        return tx.invoiceNo.toLowerCase().includes(globalSearchTerm.toLowerCase()) || tx.partyName.toLowerCase().includes(globalSearchTerm.toLowerCase());
                    }
                    return true;
                });
            }, [calculatedTransactions, activeBusinessId, globalSearchTerm]);

            const stats = React.useMemo(() => {
                const activeBizTx = calculatedTransactions.filter(t => t.businessId === activeBusinessId);
                const salesTx = activeBizTx.filter(t => t.type === 'sale');
                const purchaseTx = activeBizTx.filter(t => t.type === 'purchase');

                const totalSales = salesTx.reduce((acc, curr) => acc + curr.total, 0);
                const totalReceivables = salesTx.reduce((acc, curr) => acc + curr.balanceDue, 0);
                const totalPurchases = purchaseTx.reduce((acc, curr) => acc + curr.total, 0);
                const totalPayables = purchaseTx.reduce((acc, curr) => acc + curr.balanceDue, 0);

                const totalCash = activeBizTx.reduce((acc, curr) => curr.paymentMode === 'cash' ? acc + Number(curr.receivedAmount || 0) : acc, 0);
                const lowStockCount = inventory.filter(item => Number(item.stockQty || 0) <= Number(item.lowStockAlert || 5)).length;

                return { sales: totalSales, purchases: totalPurchases, receivables: totalReceivables, payables: totalPayables, cashInHand: totalCash, lowStockCount };
            }, [calculatedTransactions, inventory, activeBusinessId]);

            // Native CSV exporter
            const triggerCSVExport = (datasetType) => {
                let headers = [];
                let rows = [];
                if (datasetType === 'sales' || datasetType === 'purchases') {
                    headers = ['Invoice No', 'Date', 'Party Name', 'Subtotal', 'Tax Pool', 'Grand Total', 'Balance Due'];
                    rows = activeTransactionsFiltered.filter(t => t.type === (datasetType === 'sales' ? 'sale' : 'purchase')).map(t => [t.invoiceNo, t.date, t.partyName, t.subtotal.toFixed(2), t.taxAmount.toFixed(2), t.total, t.balanceDue]);
                } else if (datasetType === 'inventory') {
                    headers = ['Item Name', 'SKU', 'HSN', 'Sale Price', 'Stock Qty'];
                    rows = inventory.map(i => [i.name, i.sku, i.hsn, i.salePrice, i.stockQty]);
                } else if (datasetType === 'parties') {
                    headers = ['Party Name', 'Type', 'Mobile', 'Opening Balance'];
                    rows = parties.map(p => [p.name, p.type, p.mobile, p.openingBalance]);
                }

                if (rows.length === 0) {
                    triggerAlert('error', 'No active records discovered to compile CSV output.');
                    return;
                }

                let csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(","))].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `bobby_erp_${datasetType}_export.csv`);
                document.body.appendChild(link);
                link.click();

                                            <label className="text-[10px] font-bold text-slate-500 block mb-0.5">{t('paymentMode')}</label>
                                            <select value={txForm.paymentMode} onChange={(e)=>setTxForm(p=>({ ...p, paymentMode: e.target.value }))} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold">
                                                <option value="cash">Naked Cash Handover</option>
                                                <option value="bank">UPI / Immediate Bank Net</option>
                                                <option value="credit">Deferred Party Credit</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 block mb-0.5">{t('amountReceived')} (INR)</label>
                                            <input type="number" value={txForm.receivedAmount} onChange={(e)=>setTxForm(p=>({ ...p, receivedAmount: e.target.value }))} placeholder="Leave empty if complete clear" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold" />
                                        </div>
                                    </div>

                                    <button type="submit" className="w-full bg-slate-950 text-white font-bold text-xs py-2.5 rounded-xl transition shadow-md">{t('createInvoice')}</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ADD NEW CUSTOMER DIRECTORY SCHEMA MODAL */}
                    {showPartyModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-md shadow-2xl border border-slate-200 overflow-hidden">
                                <div className="px-5 py-3.5 bg-slate-900 text-white flex items-center justify-between">
                                    <span className="font-extrabold text-xs uppercase tracking-wider">{t('addParty')} Directory Profile</span>
                                    <button onClick={() => setShowPartyModal(false)}><X className="w-5 h-5"/></button>
                                </div>
                                <form onSubmit={submitNewParty} className="p-5 space-y-3">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-500 block mb-0.5">Customer Name *</label>
                                        <input type="text" required value={newPartyForm.name} onChange={(e)=>setNewPartyForm(p=>({ ...p, name: e.target.value }))} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold text-slate-950" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 block mb-0.5">Classification Type</label>
                                            <select value={newPartyForm.type} onChange={(e)=>setNewPartyForm(p=>({ ...p, type: e.target.value }))} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold">
                                                <option value="customer">Retail Customer</option>
                                                <option value="supplier">Vendor Supplier</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 block mb-0.5">Mobile *</label>
                                            <input type="tel" required value={newPartyForm.mobile} onChange={(e)=>setNewPartyForm(p=>({ ...p, mobile: e.target.value }))} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold font-mono" />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-slate-950 text-white py-2 text-xs font-bold rounded-xl shadow-xs">Commit Party Registration</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* INVENTORY ITEM INSERTION CONTROL DIALOG SHEET */}
                    {showItemModal && (
                        <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-md shadow-2xl border border-slate-200 overflow-hidden">
                                <div className="px-5 py-3.5 bg-slate-900 text-white flex items-center justify-between">
                                    <span className="font-extrabold text-xs uppercase tracking-wider">{t('addItem')}</span>
                                    <button onClick={() => setShowItemModal(false)}><X className="w-5 h-5"/></button>
                                </div>
                                <form onSubmit={submitNewItem} className="p-5 space-y-3">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-500 block mb-0.5">Stock Catalogue Label Name *</label>
                                        <input type="text" required value={newItemForm.name} onChange={(e)=>setNewItemForm(p=>({ ...p, name: e.target.value }))} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 block mb-0.5">Sale Rate (INR) *</label>
                                            <input type="number" required value={newItemForm.salePrice} onChange={(e)=>setNewItemForm(p=>({ ...p, salePrice: e.target.value }))} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold" />
                                        </div>
                                        <div>
                                            <label className="text-[10px] font-bold text-slate-500 block mb-0.5">Opening Stock Vol</label>
                                            <input type="number" value={newItemForm.stockQty} onChange={(e)=>setNewItemForm(p=>({ ...p, stockQty: e.target.value }))} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs font-bold" />
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-slate-950 text-white py-2 text-xs font-bold rounded-xl shadow-xs">Insert Stock Token</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* DYNAMIC COMPILING TEMPLATE INVOICE PREVIEW SYSTEM SHEET */}
                    {previewInvoice && (
                        <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="px-5 py-3 bg-slate-950 text-white flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <span className="text-xs font-bold uppercase tracking-wider">Document Rendering Pipeline</span>
                                        <select value={previewTemplate} onChange={(e)=>setPreviewTemplate(e.target.value)} className="bg-slate-800 text-white border border-slate-700 rounded-lg p-1 text-[10px] font-bold">
                                            <option value="a4">Standard A4 Sheet</option>
                                            <option value="thermal">3-inch Thermal Bill</option>
                                        </select>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => window.print()} className="text-slate-400 hover:text-white"><Printer className="w-4 h-4"/></button>
                                        <button onClick={() => setPreviewInvoice(null)}><X className="w-5 h-5"/></button>
                                    </div>
                                </div>

                                <div className="p-6 bg-slate-100 overflow-y-auto flex-1 flex justify-center">
                                    {previewTemplate === 'a4' ? (
                                        <div id="print-area" className="w-full bg-white p-8 rounded-xl shadow border border-slate-200 font-serif text-xs text-slate-800 relative">
                                            <div className="flex justify-between items-start border-b border-slate-200 pb-4 mb-4">
                                                <div>
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <BrandLogo className="w-6 h-6"/>
                                                        <h2 className="text-base font-bold tracking-tight text-slate-900">{activeBusiness.name}</h2>
                                                    </div>
                                                    <p className="text-[10px] text-slate-400 font-sans">{activeBusiness.address}, {activeBusiness.state}</p>
                                                    <p className="text-[10px] text-slate-900 font-mono font-bold mt-1 font-sans">GSTIN: {activeBusiness.gstin || 'EXEMPT/NON-GST PROFILE'}</p>
                                                </div>
                                                <div className="text-right font-sans">
                                                    <span className="bg-slate-900 text-white px-2 py-0.5 rounded-full text-[9px] font-bold uppercase tracking-wider">Tax Invoice</span>
                                                    <p className="font-mono font-bold text-slate-900 mt-2 text-xs">{previewInvoice.invoiceNo}</p>
                                                    <p className="text-[10px] text-slate-400">Date: {previewInvoice.date}</p>
                                                </div>
                                            </div>

                                            <div className="mb-4 font-sans text-[11px]">
                                                <span className="text-[9px] font-bold text-slate-400 uppercase tracking-wider block">Consignee Receiver</span>
                                                <p className="font-black text-slate-900">{previewInvoice.partyName}</p>
                                                <p className="text-[10px] text-slate-500">Method: <span className="capitalize font-bold text-slate-800">{previewInvoice.paymentMode}</span></p>
                                            </div>

                                            <table className="w-full text-left border-collapse text-xs mb-4 font-sans">
                                                <thead>
                                                    <tr className="border-b-2 border-slate-800 text-[9px] uppercase font-black text-slate-400">
                                                        <th className="py-1.5">Description</th>
                                                        <th className="py-1.5 text-center">Qty</th>
                                                        <th className="py-1.5 text-right">Rate</th>
                                                        <th className="py-1.5 text-right">Line Total</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                                                    {previewInvoice.items.map((row, i) => {
                                                        const itemMatch = inventory.find(inv=>inv.id===row.itemId) || { name: 'Item Description' };
                                                        return (
                                                            <tr key={i}>
                                                                <td className="py-2.5 font-bold text-slate-900">{itemMatch.name}</td>
                                                                <td className="py-2.5 text-center font-bold">{row.qty}</td>
                                                                <td className="py-2.5 text-right font-mono">{formatCurrency(row.rate, lang)}</td>
                                                                <td className="py-2.5 text-right font-black text-slate-900 font-mono">{formatCurrency(row.qty * row.rate, lang)}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>

                                            <div className="border-t border-slate-200 pt-3 flex justify-between font-sans">
                                                <div className="text-[10px] text-slate-400 max-w-xs">{previewInvoice.terms}</div>
                                                <div className="w-56 text-right space-y-1 text-[11px]">
                                                    <div className="flex justify-between text-slate-500"><span>Subtotal:</span><span className="font-mono">{formatCurrency(previewInvoice.subtotal, lang)}</span></div>
                                                    <div className="flex justify-between text-slate-500"><span>Tax Pool Split:</span><span className="font-mono">{formatCurrency(previewInvoice.taxAmount, lang)}</span></div>
                                                    <div className="flex justify-between font-black text-slate-900 pt-1 border-t border-slate-100 text-xs"><span>Grand Total:</span><span className="font-mono">{formatCurrency(previewInvoice.total, lang)}</span></div>
                                                    <div className="flex justify-between font-bold text-rose-700"><span>Outstanding Due:</span><span className="font-mono">{formatCurrency(previewInvoice.balanceDue, lang)}</span></div>
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div id="print-area" className="w-[76mm] bg-white p-3 border border-slate-300 font-mono text-[10px] leading-tight text-slate-950">
                                            <div className="text-center border-b border-dashed border-slate-400 pb-2 mb-2">
                                                <h4 className="font-bold text-xs uppercase">{activeBusiness.name}</h4>
                                                <p className="text-[9px]">{activeBusiness.address}</p>
                                            </div>
                                            <div className="space-y-0.5 mb-2 border-b border-dashed border-slate-400 pb-2">
                                                <p>Invoice: {previewInvoice.invoiceNo}</p>
                                                <p>Date: {previewInvoice.date}</p>
                                                <p className="truncate">Party: {previewInvoice.partyName}</p>
                                            </div>
                                            <div className="space-y-1 mb-2 border-b border-dashed border-slate-400 pb-2">
                                                {previewInvoice.items.map((row, i) => {
                                                    const itemMatch = inventory.find(inv=>inv.id===row.itemId) || { name: 'Item Description' };
                                                    return (
                                                        <div key={i} className="flex justify-between">
                                                            <span className="truncate max-w-[120px]">{itemMatch.name} ({row.qty}x)</span>
                                                            <span>{formatCurrency(row.qty * row.rate, lang)}</span>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <div className="space-y-0.5 text-right font-bold">
                                                <div className="flex justify-between"><span>Grand Total:</span><span>{formatCurrency(previewInvoice.total, lang)}</span></div>
                                                <div className="flex justify-between text-rose-900"><span>Due Balance:</span><span>{formatCurrency(previewInvoice.balanceDue, lang)}</span></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CORE SYSTEM IDENTITY META AT FOOTER */}
                    <footer className="bg-white border-t border-slate-200 px-4 py-3 text-center text-[10px] font-bold uppercase tracking-wider text-slate-400">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
                            <span>{t('bobbyOwnership')}</span>
                            <div className="flex gap-3 text-slate-300">
                                <span>Offline Cache Ready</span>
                                <span>•</span>
                                <span>AES Vault Encrypted</span>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        // Render React components directly to browser node
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
